  <!-- ZERO-LATENCY WEB AUDIO API PCM STREAMING -->
  <script>
    let audioCtx = null;
    let nextAudioTime = 0;

    window.initTtsAudio = function() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      nextAudioTime = audioCtx.currentTime;
    };

    window.playPcmChunk = function(base64Data) {
      if (!audioCtx) window.initTtsAudio();
      try {
        const binaryString = atob(base64Data);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
        const int16Array = new Int16Array(bytes.buffer);
        const audioBuffer = audioCtx.createBuffer(1, int16Array.length, 24000);
        const channelData = audioBuffer.getChannelData(0);
        for (let i = 0; i < int16Array.length; i++) {
          channelData[i] = int16Array[i] / 32768.0;
        }
        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioCtx.destination);
        const currentTime = audioCtx.currentTime;
        if (nextAudioTime < currentTime) nextAudioTime = currentTime + 0.05;
        source.start(nextAudioTime);
        nextAudioTime += audioBuffer.duration;
      } catch (e) {
        console.error("PCM Chunk play error:", e);
      }
    };

    window.stopTtsAudio = function() {
      if (audioCtx) {
        nextAudioTime = audioCtx.currentTime;
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
